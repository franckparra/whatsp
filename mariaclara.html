<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>AI Personas – Maria Clara</title>
<!-- Viewport ajustado para mobile -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#25D366">
<meta name="description" content="Chat com persona sintética – Maria Clara">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@tailwindcss/browser@4"></script>
<style>
    /* Animação customizada para os pontinhos de digitação */
    @keyframes typing-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
    }
    .dot-anim {
        animation: typing-bounce 1.4s infinite ease-in-out both;
    }
    .dot-1 { animation-delay: 0s; }
    .dot-2 { animation-delay: 0.2s; }
    .dot-3 { animation-delay: 0.4s; }
    /* CORREÇÃO MOBILE: Usar dvh (dynamic viewport height) */
    .app-container {
        height: 100vh;
        height: 100dvh; /* Dynamic viewport height para mobile */
    }
    /* Ajuste para iPhone com notch */
    @supports (padding-top: env(safe-area-inset-top)) {
        #chatHeader {
            padding-top: calc(0.75rem + env(safe-area-inset-top));
        }
        .input-area {
            padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));
        }
    }
    /* Garantir que o textarea não seja zoomado no iOS */
    textarea {
        font-size: 16px !important;
    }
    /* Scroll suave */
    #chat {
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
    }
    /* Esconder scrollbar mas permitir scroll */
    #chat::-webkit-scrollbar {
        width: 4px;
    }
    #chat::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 4px;
    }
</style>
</head>
<!-- CORREÇÃO: Remover overflow-hidden do body, usar no container -->
<body class="flex flex-col font-inter bg-gray-100 text-gray-800 m-0 p-0">
<!-- CONTAINER PRINCIPAL COM ALTURA DINÂMICA -->
<div class="app-container flex flex-col overflow-hidden">
    <!-- HEADER FIXO -->
    <header id="chatHeader" class="flex-shrink-0 bg-green-800 text-white flex items-center justify-between px-3 py-2 sm:p-3 border-b border-gray-300 shadow-md z-10">
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-gray-300 flex items-center justify-center overflow-hidden border-2 border-green-700 flex-shrink-0">
          <img id="avatarHeader" src="" alt="Avatar" class="w-full h-full object-cover">
        </div>
        <div class="min-w-0 flex-1">
          <h1 id="headerName" class="text-sm sm:text-base font-semibold leading-tight truncate">Carregando…</h1>
          <p id="headerBadge" class="text-xs text-gray-200 truncate"></p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-shrink-0">
        <div class="flex items-center gap-1 text-xs text-gray-200 bg-green-900/30 px-2 py-1 rounded-full">
          <div id="statusDot" class="w-2 h-2 rounded-full bg-green-400 animate-pulse flex-shrink-0"></div>
          <span id="statusText" class="hidden sm:inline">Online</span>
        </div>
      </div>
    </header>
    <!-- CONTROLES DA CONVERSA -->
    <div class="flex-shrink-0 flex justify-center gap-3 p-2 bg-gray-200/50 border-b border-gray-300">
      <button class="bg-green-800 text-white px-3 py-1.5 rounded text-xs hover:bg-green-900 transition active:scale-95" onclick="exitChat()">Sair</button>
      <button class="bg-gray-600 text-white px-3 py-1.5 rounded text-xs hover:bg-gray-700 transition active:scale-95" onclick="clearChat()">Limpar</button>
    </div>
    <!-- CHAT AREA (ÚNICA ÁREA QUE ROLA) -->
    <!-- flex-1 ocupa espaço restante, overflow-y-auto permite scroll -->
    <div id="chat" class="flex-1 overflow-y-auto overflow-x-hidden p-3 sm:p-4 flex flex-col gap-3 sm:gap-4 bg-[url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')] bg-repeat bg-fixed">
      <!-- WELCOME -->
      <div id="welcome" class="flex flex-col items-center text-center animate-fadeIn mt-4 mb-auto">
        <div id="welcomeAvatar" class="w-24 h-24 sm:w-32 sm:h-32 rounded-full bg-green-800 flex items-center justify-center text-white text-3xl mb-3 shadow-lg border-4 border-white flex-shrink-0"></div>
        <div id="welcomeBadge" class="inline-block bg-green-100 text-green-800 text-xs font-bold uppercase px-3 py-1 rounded-full mb-2 border border-green-200"></div>
        <h2 id="welcomeTitle" class="text-lg sm:text-xl font-bold mb-1 text-gray-800 px-2"></h2>
        <h3 id="welcomeSubtitle" class="text-sm text-gray-600 mb-3 font-medium px-2"></h3>
        <blockquote id="welcomeQuote" class="bg-white border-l-4 border-green-800 p-3 sm:p-4 rounded-lg shadow-md max-w-sm sm:max-w-md text-left text-gray-700 italic text-sm mx-2"></blockquote>
      </div>
    </div>
    <!-- INPUT AREA FIXO (RODAPÉ) -->
    <!-- flex-shrink-0 impede que ele colapse -->
    <div class="input-area flex-shrink-0 bg-white border-t border-gray-300 p-2 sm:p-3 z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
      <div class="flex items-end gap-2 max-w-4xl mx-auto">
        <button id="micBtn" class="w-9 h-9 sm:w-10 sm:h-10 bg-gray-200 text-gray-600 rounded-full flex items-center justify-center hover:bg-gray-300 transition active:scale-95 flex-shrink-0"
                title="Gravar voz">🎤</button>
        <textarea id="userInput" rows="1"
                  class="flex-1 bg-gray-100 border border-gray-300 rounded-2xl px-3 sm:px-4 py-2 sm:py-3 resize-none focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white transition-all max-h-32 text-sm sm:text-base min-h-[44px]"
                  placeholder="Mensagem..."
                  onkeydown="handleKey(event)"
                  oninput="autoResize(this);updateSendButton()"></textarea>
        <button id="sendBtn" onclick="sendMessage()" class="w-10 h-10 sm:w-11 sm:h-11 bg-green-800 text-white rounded-full flex items-center justify-center hover:bg-green-900 transition active:scale-95 shadow-md disabled:opacity-50 disabled:cursor-not-allowed flex-shrink-0" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6 transform rotate-45 sm:rotate-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
        </button>
      </div>
    </div>
</div> <!-- FIM DO CONTAINER PRINCIPAL -->

<!-- TOAST -->
<div id="toast"
     class="fixed bottom-28 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl hidden z-50 flex items-center gap-2 text-sm font-medium transition-opacity duration-300 max-w-[90%] text-center">
  <span id="toastIcon">ℹ️</span>
  <span id="toastMsg">Mensagem</span>
</div>
<script>
/* -------------------------------------------------
   PERSONAS – Maria Clara
   ------------------------------------------------- */
const PERSONAS = {
  "maria":{
    "nome":"Maria Clara",
    "avatar":"maria.jpg",
    "badge":"Persona Sintética",
    "welcomeTitle":"Olá! Sou a Maria Clara",
    "welcomeSubtitle":"31 anos - Rio de Janeiro - RJ",
    "welcomeQuote":"Sua amiga aqui no chat. Vamos conversar?",
    "apiUrl":"https://api.zap01f.tokenslp.com.br"
  }
};
/* -------------------------------------------------
   UTILIDADES
   ------------------------------------------------- */
function getPersonaId(){
  const params = new URLSearchParams(location.search);
  return params.get('p') || 'maria';
}
function getPersonaGender(pid){
  const femaleIds = ['maria','laura','fernanda'];
  return femaleIds.includes(pid) ? 'female' : 'male';
}
/* -------------------------------------------------
   CONTADOR DE MENSAGENS DO USUÁRIO (LIMITE 20)
   ------------------------------------------------- */
const MSG_LIMIT = 20;
function getUserMessageCount(){
  return conversationHistory.filter(m => m.role === 'user').length;
}
function renderLimitMessage(){
  const chat=document.getElementById('chat');
  const p = PERSONAS[getPersonaId()];
  const div=document.createElement('div');
  div.className='flex justify-center mb-4 w-full';
  div.innerHTML=`
    <div class="bg-amber-50 border border-amber-300 text-amber-800 px-4 py-3 rounded-xl text-sm font-medium text-center max-w-[85%] shadow-sm">
      ⚠️ Você atingiu o limite de ${MSG_LIMIT} mensagens desta sessão de teste com a ${p.nome}
    </div>
  `;
  chat.appendChild(div);
  scrollToBottom();
}
function disableInput(){
  const input = document.getElementById('userInput');
  input.disabled = true;
  input.placeholder = 'Limite de mensagens atingido';
  input.classList.add('opacity-50','cursor-not-allowed');
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('micBtn').disabled = true;
  document.getElementById('micBtn').classList.add('opacity-50','cursor-not-allowed');
}
/* -------------------------------------------------
   CARREGAR DADOS DA PERSONA
   ------------------------------------------------- */
function loadPersona(){
  const pid = getPersonaId();
  const p = PERSONAS[pid] || PERSONAS['maria'];
  document.getElementById('avatarHeader').src = p.avatar;
  document.getElementById('headerName').textContent = p.nome;
  document.getElementById('headerBadge').textContent = p.badge;
  const welcomeAvatar = document.getElementById('welcomeAvatar');
  welcomeAvatar.innerHTML = `<img src="${p.avatar}" alt="${p.nome}" class="w-full h-full object-cover rounded-full border-2 border-white shadow-sm">`;
  document.getElementById('welcomeBadge').textContent = p.badge;
  document.getElementById('welcomeTitle').textContent = p.welcomeTitle;
  document.getElementById('welcomeSubtitle').textContent = p.welcomeSubtitle;
  document.getElementById('welcomeQuote').textContent = p.welcomeQuote;
  document.title = `AI Personas – ${p.nome}`;
}
/* -------------------------------------------------
   ESTADO
   ------------------------------------------------- */
let conversationHistory = [];
let isLoading = false;
/* -------------------------------------------------
   INICIALIZAÇÃO
   ------------------------------------------------- */
function init(){
  loadPersona();
  const savedHistory = localStorage.getItem('whats_personas_history');
  if(savedHistory){
    conversationHistory = JSON.parse(savedHistory);
    if(conversationHistory.length>0){
      document.getElementById('welcome').style.display='none';
      conversationHistory.forEach(msg=>{
        if(msg.role!=='system') renderMessage(msg.role==='user'?'user':'debora',msg.content,false);
      });
    }
  }
  // Verificar se o limite já foi atingido ao restaurar histórico
  if(getUserMessageCount() >= MSG_LIMIT){
    renderLimitMessage();
    disableInput();
  }
  // Scroll para o final após inicialização
  setTimeout(() => scrollToBottom(), 100);
}
/* -------------------------------------------------
   AÇÕES DA CONVERSA
   ------------------------------------------------- */
function clearChat(){
  if(!confirm("Deseja realmente limpar toda a conversa?")) return;
  conversationHistory=[];
  localStorage.removeItem('whats_personas_history');
  location.reload();
}
function exitChat(){
  window.location.href='select.html';
}
/* -------------------------------------------------
   BOTÃO DE ENVIO
   ------------------------------------------------- */
function updateSendButton(){
  const input=document.getElementById('userInput');
  const btn=document.getElementById('sendBtn');
  btn.disabled = input.value.trim().length===0 || isLoading || input.disabled;
  if(!btn.disabled){
     btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 sm:ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7" /></svg>`;
  } else {
     btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform rotate-45 sm:rotate-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>`;
  }
}
/* -------------------------------------------------
   RENDERIZAÇÃO DE MENSAGENS
   ------------------------------------------------- */
function renderMessage(role,content,animate=true){
  const chat=document.getElementById('chat');
  const welcome=document.getElementById('welcome');
  if(welcome && welcome.style.display !== 'none') welcome.style.display='none';
  const isBot=role==='debora';
  const p=PERSONAS[getPersonaId()];
  const avatarSrc = isBot ? p.avatar : '';
  const avatarHTML = isBot
    ? `<div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full overflow-hidden flex-shrink-0 mt-1"><img src="${avatarSrc}" class="w-full h-full object-cover"></div>`
    : `<div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-green-100 text-green-700 flex items-center justify-center flex-shrink-0 mt-1 text-xs font-bold">EU</div>`;
  const alignClass = isBot ? 'justify-start' : 'justify-end';
  const msgBubbleClass = isBot
    ? 'bg-white text-gray-800 rounded-tr-2xl border border-gray-200'
    : 'bg-green-100 text-gray-800 rounded-tl-2xl border border-green-200';
  const nameText = isBot ? p.nome : 'Você';
  const nameColor = isBot ? 'text-green-700' : 'text-green-800';
  const msgDiv=document.createElement('div');
  msgDiv.className=`flex gap-2 mb-2 w-full ${alignClass}`;
  const bubbleContent = `
    <div class="max-w-[85%] sm:max-w-[75%]">
        <div class="flex items-baseline gap-2 ${isBot ? 'flex-row' : 'flex-row-reverse'}">
            <span class="text-[14px] font-bold ${nameColor}">${nameText}</span>
            <span class="text-[14px] text-gray-400">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
        </div>
        <div class="px-3 py-2 shadow-sm text-sm leading-relaxed whitespace-pre-wrap ${msgBubbleClass}">${formatMessage(content)}</div>
        ${isBot ? `<div class="mt-1 flex gap-2">
             <button class="text-[10px] text-gray-400 hover:text-green-600 transition" onclick="toggleSpeak(this)" data-text="${encodeURIComponent(content)}">🔊</button>
        </div>` : ''}
    </div>
    ${avatarHTML}
  `;
  msgDiv.innerHTML = bubbleContent;
  if(animate) {
    msgDiv.classList.add('opacity-0', 'translate-y-4');
    chat.appendChild(msgDiv);
    setTimeout(() => {
        msgDiv.classList.remove('opacity-0', 'translate-y-4');
        msgDiv.classList.add('transition-all', 'duration-300');
        scrollToBottom();
    }, 10);
  } else {
    chat.appendChild(msgDiv);
    scrollToBottom();
  }
}
function scrollToBottom() {
    const chat = document.getElementById('chat');
    chat.scrollTop = chat.scrollHeight;
}
function formatMessage(text){
  let html=text
    .replace(/```(\w+)?\n?([\s\S]*?)```/g,(_,lang,code)=>`<pre class="bg-gray-800 text-green-100 p-2 rounded text-xs overflow-x-auto my-2"><code>${escapeHtml(code.trim())}</code></pre>`)
    .replace(/`([^`]+)`/g,(_,c)=>`<code class="bg-gray-200 px-1 rounded text-xs font-mono">${escapeHtml(c)}</code>`)
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/\n\n/g,'</p><p class="mt-2">')
    .replace(/\n/g,'<br>');
  return html;
}
function escapeHtml(t){return t.replace(/[&<>]/g,ch=>({ '&':'&amp;','<':'<','>':'>' }[ch]));}
/* -------------------------------------------------
   INDICADOR DE DIGITAÇÃO
   ------------------------------------------------- */
function showTyping(){
  const chat=document.getElementById('chat');
  const div=document.createElement('div');
  div.id='typing-indicator';
  div.className='flex gap-2 mb-4 w-full justify-start animate-fadeIn';
  div.innerHTML=`
    <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full overflow-hidden flex-shrink-0 mt-1">
        <img src="${PERSONAS[getPersonaId()].avatar}" class="w-full h-full object-cover">
    </div>
    <div class="bg-white border border-gray-200 px-4 py-3 rounded-2xl rounded-tl-none shadow-sm w-16 flex items-center justify-center gap-1">
      <div class="w-2 h-2 bg-gray-400 rounded-full dot-anim dot-1"></div>
      <div class="w-2 h-2 bg-gray-400 rounded-full dot-anim dot-2"></div>
      <div class="w-2 h-2 bg-gray-400 rounded-full dot-anim dot-3"></div>
    </div>
  `;
  chat.appendChild(div);
  scrollToBottom();
}
function removeTyping(){
  const el=document.getElementById('typing-indicator');
  if(el) el.remove();
}
/* -------------------------------------------------
   ENVIO DE MENSAGENS
   ------------------------------------------------- */
async function sendMessage(){
  const input=document.getElementById('userInput');
  const text=input.value.trim();
  if(!text || isLoading) return;
  // Verificar limite de mensagens do usuário
  if(getUserMessageCount() >= MSG_LIMIT){
    renderLimitMessage();
    disableInput();
    return;
  }
  input.value='';
  input.style.height = 'auto';
  updateSendButton();
  isLoading=true;
  setStatus('loading','Digitando...');
  renderMessage('user',text);
  conversationHistory.push({role:'user',content:text});
  showTyping();
  try{
    const reply=await callAPI();
    removeTyping();
    renderMessage('debora',reply);
    conversationHistory.push({role:'assistant',content:reply});
    localStorage.setItem('whats_personas_history',JSON.stringify(conversationHistory));
    setStatus('ready','Online');
  }catch(e){
    removeTyping();
    setStatus('error','Erro');
    showToast('Erro: '+e.message,'error');
    console.error(e);
  }
  // Verificar se o limite foi atingido após esta interação
  if(getUserMessageCount() >= MSG_LIMIT){
    renderLimitMessage();
    disableInput();
  }
  isLoading=false;
  updateSendButton();
  input.focus();
}
/* -------------------------------------------------
   CHAMADA À API
   ------------------------------------------------- */
async function callAPI(){
  const pid=getPersonaId();
  const endpoint=PERSONAS[pid].apiUrl;
  const res=await fetch(endpoint,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      message:conversationHistory[conversationHistory.length-1].content,
      history:conversationHistory.slice(0,-1)
    })
  });
  const txt=await res.text();
  let data;
  try{data=JSON.parse(txt)}catch(e){throw new Error('Resposta inválida')}
  if(!res.ok||data.error)throw new Error(data.error||`HTTP ${res.status}`);
  if(!data.reply)throw new Error('Resposta vazia');
  return data.reply;
}
/* -------------------------------------------------
   TTS - VERSÃO FINAL CORRIGIDA
   ------------------------------------------------- */
let currentUtterance = null;
function toggleSpeak(btn) {
  const txt = decodeURIComponent(btn.dataset.text);
  if (!txt) return;
  if (btn.classList.contains('speaking')) {
    window.speechSynthesis.cancel();
    btn.classList.remove('speaking');
    btn.textContent = '🔊';
    currentUtterance = null;
    return;
  }
  window.speechSynthesis.cancel();
  document.querySelectorAll('button[data-text].speaking').forEach(b => {
    b.classList.remove('speaking');
    b.textContent = '🔊';
  });
  const clean = txt.replace(/\*\*/g, '').replace(/\*/g, '').replace(/^#+\s/gm, '').trim();
  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = 'pt-BR';
  utter.rate = 0.88;
  utter.pitch = 1.0;
  utter.onstart = () => {
    btn.classList.add('speaking');
    btn.textContent = '⏹';
  };
  utter.onend = () => {
    btn.classList.remove('speaking');
    btn.textContent = '🔊';
    currentUtterance = null;
  };
  utter.onerror = () => {
    btn.classList.remove('speaking');
    btn.textContent = '🔊';
    currentUtterance = null;
  };
  currentUtterance = utter;
  const speak = () => {
    const voices = window.speechSynthesis.getVoices();
    const gender = getPersonaGender(getPersonaId());
    let selectedVoice = null;
    if (gender === 'female') {
      selectedVoice = voices.find(v =>
        v.lang.includes('pt-BR') &&
        /francisca|vitoria|luciana|female|google português do brasil/i.test(v.name)
      );
      utter.pitch = 1.1;
    } else {
      selectedVoice = voices.find(v =>
        v.lang.includes('pt-BR') &&
        /daniel|ricardo|bruno|fabio|male/i.test(v.name)
      );
      utter.pitch = 0.9;
    }
    if (!selectedVoice) {
      selectedVoice = voices.find(v => v.lang.includes('pt-BR')) || voices.find(v => v.lang.startsWith('pt'));
    }
    if (selectedVoice) utter.voice = selectedVoice;
    window.speechSynthesis.speak(utter);
  };
  if (window.speechSynthesis.getVoices().length === 0) {
    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.onvoiceschanged = null;
      speak();
    };
  } else {
    speak();
  }
}
/* -------------------------------------------------
   SPEECH-TO-TEXT
   ------------------------------------------------- */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition;
if(SpeechRecognition){
  recognition=new SpeechRecognition();
  recognition.lang='pt-BR';
  recognition.interimResults=true;
}
const micBtn=document.getElementById('micBtn');
let listening=false;
micBtn.addEventListener('click',()=>{
  if(!recognition){showToast('Navegador não suporta voz.','error');return;}
  if(listening){
    recognition.stop();
    return;
  }
  recognition.start();
  listening=true;
  micBtn.classList.add('bg-red-100', 'text-red-600', 'animate-pulse');
});
recognition?.addEventListener('result',e=>{
  const txt=Array.from(e.results).map(r=>r[0].transcript).join(' ');
  const ta=document.getElementById('userInput');
  ta.value=txt;
  autoResize(ta);
  updateSendButton();
});
recognition?.addEventListener('end',()=>{listening=false;micBtn.classList.remove('bg-red-100', 'text-red-600', 'animate-pulse');});
/* -------------------------------------------------
   UI HELPERS
   ------------------------------------------------- */
function setStatus(type,text){
  const dot=document.getElementById('statusDot');
  const label=document.getElementById('statusText');
  if(type==='loading'){
    dot.className='w-2 h-2 rounded-full bg-yellow-400 animate-spin flex-shrink-0';
    label.textContent=text;
  } else if (type==='error'){
    dot.className='w-2 h-2 rounded-full bg-red-500 flex-shrink-0';
    label.textContent='Offline';
  } else {
    dot.className='w-2 h-2 rounded-full bg-green-400 flex-shrink-0';
    label.textContent='Online';
  }
}
function showToast(msg,type='info'){
  const t=document.getElementById('toast');
  const icon = document.getElementById('toastIcon');
  const txt = document.getElementById('toastMsg');
  txt.textContent=msg;
  t.className='fixed bottom-28 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl z-50 flex items-center gap-2 text-sm font-medium transition-all duration-300 translate-y-0 opacity-100 max-w-[90%] text-center';
  if(type==='error'){
    t.classList.add('bg-red-600', 'text-white');
    icon.textContent='⚠️';
  } else {
    t.classList.add('bg-gray-800', 'text-white');
    icon.textContent='✅';
  }
  t.classList.remove('hidden');
  setTimeout(()=>{
    t.classList.add('opacity-0', 'translate-y-4');
    setTimeout(()=>t.classList.add('hidden'),300);
  },3000);
}
function handleKey(e){
  if(e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}
function autoResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}
/* -------------------------------------------------
   AJUSTE MOBILE: Recalcular altura quando teclado aparecer
   ------------------------------------------------- */
window.addEventListener('resize', () => {
  scrollToBottom();
});
// Forçar altura correta em mobile
function fixMobileHeight() {
  const dvh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty('--dvh', `${dvh}px`);
  scrollToBottom();
}
window.addEventListener('load', fixMobileHeight);
window.addEventListener('orientationchange', fixMobileHeight);
/* -------------------------------------------------
   INICIALIZAÇÃO
   ------------------------------------------------- */
try{init();}catch(e){console.error(e);}
</script>
